[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glove-inspect"
version = "1.0.0"
description = "Vision-based glove defect inspection and sorting (OpenCV, MLP, fuzzy logic, PySide6, Arduino)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Ali Sadiq" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "scikit-fuzzy>=0.4.2",
    "PyYAML>=6.0",
    "pyserial>=3.5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
glovesim = "glovesim.cli:main"
glove-inspect = "gloveinspect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:skfuzzy.*"]
